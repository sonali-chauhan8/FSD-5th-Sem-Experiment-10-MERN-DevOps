services:
  # Render Web Service for Express & Node.js Backend API
  - type: web
    name: student-management-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard (e.g. MongoDB Atlas cluster URI)
      - key: CLIENT_URL
        sync: false # Set to Vercel production frontend domain (e.g. https://student-management.vercel.app)

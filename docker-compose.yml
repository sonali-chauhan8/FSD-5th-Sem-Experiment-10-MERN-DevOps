# ====================================================================
# Docker Compose Orchestration for MERN Student Management System
# B.Tech Experiment 10: Multi-Container Setup with Health Checks
# ====================================================================

services:
  # ------------------------------------------------------------------
  # Service 1: MongoDB Database Service with Persistent Volume
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:7.0-jammy
    container_name: student_mgmt_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017" # Host 27018 -> Container 27017 (avoids host port 27017 collision)
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-student_mgmt_docker_db}
    volumes:
      - mongodb_data:/data/db # Named volume for persistent database storage
    networks:
      - mern_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ------------------------------------------------------------------
  # Service 2: Express & Node.js Backend REST API
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_mgmt_backend
    restart: unless-stopped
    ports:
      - "5001:5000" # Host 5001 -> Container 5000
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/student_mgmt_docker_db}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      mongodb:
        condition: service_healthy # Wait until MongoDB is actively accepting connections
    networks:
      - mern_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------------------
  # Service 3: React + Vite Single Page Application (Nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_mgmt_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Host 8080 -> Container 80 (Nginx)
    depends_on:
      backend:
        condition: service_healthy # Wait until Express backend is up and healthy
    networks:
      - mern_network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# --------------------------------------------------------------------
# Persistent Storage Volumes
# --------------------------------------------------------------------
volumes:
  mongodb_data:
    driver: local

# --------------------------------------------------------------------
# Isolated Docker Bridge Network
# --------------------------------------------------------------------
networks:
  mern_network:
    driver: bridge
